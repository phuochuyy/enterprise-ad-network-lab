# Firewall policy test (issue #5): expected allow/deny between VLANs, checked with real traffic.
# Single source of truth: terraform/envs/fw-test creates the probes from `probes`, and
# tests/firewall/run.py starts the listeners and runs the `cases`.
#
# Semantics:
#   allow - a TCP connect succeeds / a UDP reply comes back / ping answers
#   deny  - nothing comes back before the timeout (pf drops; it never rejects)
#   via   - (proto path) a TCP traceroute to the port passes through that hop: proves the route
# `stage: pre-vpn` cases run before the probe with `vpn:` brings its tunnel up.
# Every TCP/UDP port a case targets is listened on by the target probe, so a "deny" can only
# come from the firewall, not from a closed port.
#
# `targets` are real hosts (the domain controllers, #7), tested with their real services. For
# them "deny" is the end-to-end property - nothing answers - whichever layer drops it (pf, or
# Windows Firewall behind it); WinRM 5986 is open on the DCs, so a pf leak there would show.

template_vm_id: 9004

# Keys are the probes' roles in the cases below; `name` follows the <site>-<role><nn> convention.

probes:
  hq-mgmt: { name: hq-prb01, vm_id: 951, bridge: vmbr10, vlan: 10, ip: 172.16.10.50, gateway: 172.16.10.1 }
  hq-srv: { name: hq-prb02, vm_id: 952, bridge: vmbr10, vlan: 20, ip: 172.16.20.12, gateway: 172.16.20.1 }
  hq-usr: { name: hq-prb03, vm_id: 953, bridge: vmbr10, vlan: 30, ip: 172.16.30.150, gateway: 172.16.30.1 }
  hq-dmz: { name: hq-prb04, vm_id: 954, bridge: vmbr10, vlan: 40, ip: 172.16.40.50, gateway: 172.16.40.1 }
  br-srv: { name: br-prb01, vm_id: 955, bridge: vmbr20, vlan: 120, ip: 172.17.20.12, gateway: 172.17.20.1 }
  br-usr: { name: br-prb02, vm_id: 956, bridge: vmbr20, vlan: 130, ip: 172.17.30.150, gateway: 172.17.30.1 }
  # Outside the sites, on the simulated WAN: an admin laptop on the remote-access VPN (#6), and
  # before the tunnel is up, a stranger on the WAN. Internet DNS for apt (wireguard-tools).
  rw: { name: hq-prb05, vm_id: 957, bridge: vmbr1, ip: 10.10.10.70, gateway: 10.10.10.1, dns: 1.1.1.1,
        vpn: { config: ansible/build/wireguard/rw-test.conf } }

targets:
  hq-dc: 172.16.20.11 # hq-dc01
  br-dc: 172.17.20.11 # br-dc01

listen:
  hq-mgmt: { tcp: [22, 443] }
  hq-srv: { tcp: [22, 53, 88, 135, 389, 445, 636, 3389, 5986], udp: [53, 88, 123] }
  hq-usr: { tcp: [22, 3389] }
  hq-dmz: { tcp: [22, 80, 445] }
  br-srv: { tcp: [22, 53, 88, 389, 445, 3389], udp: [53] }
  br-usr: { tcp: [22, 3389] }
  rw: {}

# Targets: a probe name, "fw" (the probe's own gateway on the firewall) or an IP address.
cases:
  # --- HQ Users -> domain controller: only the AD DS client ports ----------------------------
  - { from: hq-usr, to: hq-dc, proto: tcp, port: 445, expect: allow, why: Users to DCs - SMB (SYSVOL, GPO) }
  - { from: hq-usr, to: hq-dc, proto: tcp, port: 389, expect: allow, why: Users to DCs - LDAP }
  - { from: hq-usr, to: hq-dc, proto: tcp, port: 88, expect: allow, why: Users to DCs - Kerberos }
  - { from: hq-usr, to: hq-dc, proto: udp, port: 53, expect: allow, why: Users to DCs - DNS }
  - { from: hq-usr, to: hq-dc, proto: icmp, expect: allow, why: Users ping DCs }
  - { from: hq-usr, to: hq-dc, proto: tcp, port: 5986, expect: deny, why: Users cannot reach WinRM on the DC (open on the DC itself) }
  - { from: hq-usr, to: hq-srv, proto: tcp, port: 22, expect: deny, why: Users cannot SSH to servers }
  - { from: hq-usr, to: hq-srv, proto: tcp, port: 3389, expect: deny, why: Users cannot RDP to servers }
  - { from: hq-usr, to: hq-srv, proto: tcp, port: 5986, expect: deny, why: Users cannot reach WinRM }
  # --- HQ Users -> everything else internal: denied ------------------------------------------
  - { from: hq-usr, to: hq-mgmt, proto: tcp, port: 22, expect: deny, why: Users cannot reach the Mgmt VLAN }
  - { from: hq-usr, to: hq-mgmt, proto: icmp, expect: deny, why: Mgmt VLAN invisible to users }
  - { from: hq-usr, to: hq-dmz, proto: tcp, port: 80, expect: deny, why: Users cannot reach the DMZ directly }
  - { from: hq-usr, to: fw, proto: tcp, port: 443, expect: deny, why: Users cannot open the firewall GUI }
  # --- HQ Users -> Internet: web only, DNS only through the DCs ------------------------------
  - { from: hq-usr, to: 1.1.1.1, proto: tcp, port: 443, expect: allow, why: Users browse the web }
  - { from: hq-usr, to: 1.1.1.1, proto: udp, port: 53, expect: deny, why: No direct Internet DNS for clients }
  # --- HQ Mgmt: trusted admin VLAN -----------------------------------------------------------
  - { from: hq-mgmt, to: hq-srv, proto: tcp, port: 22, expect: allow, why: Admins manage servers }
  - { from: hq-mgmt, to: hq-srv, proto: tcp, port: 3389, expect: allow, why: Admins RDP to servers }
  - { from: hq-mgmt, to: hq-usr, proto: tcp, port: 3389, expect: allow, why: Admins support clients }
  - { from: hq-mgmt, to: fw, proto: tcp, port: 443, expect: allow, why: Admins open the firewall GUI }
  # --- HQ Servers ----------------------------------------------------------------------------
  - { from: hq-srv, to: fw, proto: udp, port: 53, expect: allow, why: Servers resolve through the firewall }
  - { from: hq-srv, to: 1.1.1.1, proto: tcp, port: 443, expect: allow, why: Servers fetch updates }
  - { from: hq-srv, to: hq-usr, proto: tcp, port: 22, expect: deny, why: Servers do not initiate to clients }
  - { from: hq-srv, to: hq-mgmt, proto: tcp, port: 22, expect: deny, why: Servers cannot reach the Mgmt VLAN }
  # --- HQ DMZ: Internet-facing, isolated from the inside -------------------------------------
  - { from: hq-dmz, to: hq-srv, proto: tcp, port: 445, expect: deny, why: DMZ isolated from servers }
  - { from: hq-dmz, to: hq-srv, proto: icmp, expect: deny, why: DMZ cannot even ping inside }
  - { from: hq-dmz, to: hq-usr, proto: tcp, port: 22, expect: deny, why: DMZ isolated from users }
  - { from: hq-dmz, to: hq-mgmt, proto: tcp, port: 22, expect: deny, why: DMZ isolated from Mgmt }
  - { from: hq-dmz, to: 1.1.1.1, proto: tcp, port: 443, expect: allow, why: DMZ reaches the web }
  # --- Branch --------------------------------------------------------------------------------
  - { from: br-usr, to: br-dc, proto: tcp, port: 445, expect: allow, why: Branch users to their DC - SMB }
  - { from: br-usr, to: br-dc, proto: udp, port: 53, expect: allow, why: Branch users to their DC - DNS }
  - { from: br-usr, to: br-srv, proto: tcp, port: 22, expect: deny, why: Branch users cannot SSH to servers }
  - { from: br-usr, to: br-srv, proto: tcp, port: 3389, expect: deny, why: Branch users cannot RDP to servers }
  - { from: br-usr, to: 1.1.1.1, proto: tcp, port: 443, expect: allow, why: Branch users browse the web }
  - { from: br-srv, to: br-usr, proto: tcp, port: 22, expect: deny, why: Branch servers do not initiate to clients }
  - { from: br-srv, to: fw, proto: udp, port: 53, expect: allow, why: Branch servers resolve through the firewall }
  # --- Cross-site over the WireGuard site-to-site tunnel (#6) ----------------------------------
  - { from: br-usr, to: hq-dc, proto: path, port: 445, expect: via 172.31.255.1, why: Branch to HQ goes through the tunnel }
  - { from: br-usr, to: hq-dc, proto: tcp, port: 445, expect: allow, why: Branch users to HQ DC - SMB }
  - { from: br-usr, to: hq-dc, proto: tcp, port: 389, expect: allow, why: Branch users to HQ DC - LDAP }
  - { from: br-usr, to: hq-dc, proto: udp, port: 53, expect: allow, why: Branch users to HQ DC - DNS }
  - { from: br-usr, to: hq-srv, proto: tcp, port: 22, expect: deny, why: Branch users cannot SSH to HQ servers }
  - { from: br-usr, to: hq-mgmt, proto: tcp, port: 22, expect: deny, why: Branch users cannot reach HQ Mgmt }
  - { from: br-usr, to: hq-usr, proto: tcp, port: 3389, expect: deny, why: No client-to-client across sites }
  - { from: hq-usr, to: br-dc, proto: tcp, port: 445, expect: allow, why: HQ users can authenticate at the Branch DC }
  - { from: hq-usr, to: br-usr, proto: tcp, port: 22, expect: deny, why: No client-to-client across sites }
  - { from: hq-srv, to: br-dc, proto: tcp, port: 389, expect: allow, why: HQ servers to the Branch DC (auth, replication) }
  - { from: br-srv, to: hq-dc, proto: tcp, port: 88, expect: allow, why: Branch servers to the HQ DC (auth, replication) }
  - { from: hq-mgmt, to: br-srv, proto: tcp, port: 22, expect: allow, why: HQ admins manage Branch servers }
  - { from: br-srv, to: hq-mgmt, proto: tcp, port: 22, expect: deny, why: Branch cannot reach HQ Mgmt }
  - { from: hq-dmz, to: br-srv, proto: tcp, port: 445, expect: deny, why: DMZ cannot reach the Branch }
  # --- From the WAN, before the VPN is up: nothing but the VPN port is exposed -----------------
  - { from: rw, to: 10.10.10.11, proto: tcp, port: 443, expect: deny, stage: pre-vpn, why: Firewall GUI not exposed to the WAN }
  - { from: rw, to: 10.10.10.11, proto: tcp, port: 22, expect: deny, stage: pre-vpn, why: Firewall SSH not exposed to the WAN }
  - { from: rw, to: 10.10.10.12, proto: tcp, port: 443, expect: deny, stage: pre-vpn, why: Branch GUI not exposed to the WAN }
  # --- Remote-access VPN (admin laptop) ----------------------------------------------------------
  - { from: rw, to: hq-mgmt, proto: path, port: 22, expect: via 172.31.0.1, why: Admin traffic enters through the VPN }
  - { from: rw, to: hq-mgmt, proto: tcp, port: 22, expect: allow, why: VPN admins reach HQ Mgmt }
  - { from: rw, to: hq-srv, proto: tcp, port: 5986, expect: allow, why: VPN admins reach WinRM on servers }
  - { from: rw, to: br-srv, proto: tcp, port: 22, expect: allow, why: VPN admins reach Branch servers through HQ }
  - { from: rw, to: hq-usr, proto: tcp, port: 3389, expect: deny, why: VPN admins do not land on client VLANs }
  - { from: rw, to: hq-dmz, proto: tcp, port: 80, expect: deny, why: VPN is for management, not the DMZ }
