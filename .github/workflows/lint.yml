name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - uses: pre-commit/action@v3.0.1

  terraform-test:
    name: terraform-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [pve-vm]
    defaults:
      run:
        working-directory: terraform/modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -backend=false -input=false
      - run: terraform test

  packer-validate:
    name: packer-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [ws2022-core, ws2022-desktop, win11]
    defaults:
      run:
        working-directory: packer/windows
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@v3

      # validate needs a value; a throwaway random one keeps literals out of the repo (gitleaks)
      - run: echo "PKR_VAR_admin_password=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - run: packer init .
      - run: packer fmt -check -diff -recursive .
      - run: packer validate -var-file=vars/${{ matrix.template }}.pkrvars.hcl .
