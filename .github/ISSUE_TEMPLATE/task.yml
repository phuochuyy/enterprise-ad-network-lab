name: Task
description: A planned piece of work (feature, chore, docs)
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do we want and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to capture
      description: Screenshots / videos / command output that prove it works.
