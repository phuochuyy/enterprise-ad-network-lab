# cloudbase-init service: runs at every boot of a clone; plugins execute once per instance id.
# Applies the static IP/DNS written by Proxmox (configdrive2), grows the system volume to the
# disk size chosen in Terraform, and regenerates the WinRM HTTPS certificate for the new hostname.
[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
netbios_host_name_compatibility=true
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
# UserDataPlugin re-applies the hostname from Proxmox user_data AFTER OOBE: on client SKUs
# (Windows 11) msoobe's ComputerName plugin replaces the name set in specialize with a random
# DESKTOP-XXXX. It must come before LocalScriptsPlugin: a rename requests a reboot, so the
# WinRM certificate is issued on the next boot, for the final name. On servers the name is
# already right and no reboot happens. Only the hostname key of user_data is honoured.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin
cloud_config_plugins=hostname,set_hostname
allow_reboot=true
stop_service_on_exit=false
check_latest_version=false
