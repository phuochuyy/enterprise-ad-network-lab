# Runs once during sysprep "specialize" on every clone (before first boot completes).
# Sets the hostname from the Proxmox cloud-init drive so the machine never boots as WIN-XXXX.
[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
netbios_host_name_compatibility=true
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
# Proxmox puts the hostname only in user_data ("#cloud-config" / hostname: <vm name>), never in
# meta_data.json (PVE::QemuServer::Cloudinit::cloudbase_configdrive2_metadata), so
# SetHostNamePlugin alone logs "Hostname not found in metadata". UserDataPlugin reads it, and
# cloud_config_plugins whitelists that one key: the Linux-oriented rest of Proxmox's user_data
# (package_upgrade, chpasswd, users: [default]) is ignored.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin
cloud_config_plugins=hostname,set_hostname
allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
