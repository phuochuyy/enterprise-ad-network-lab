# Render config.xml on the control node only - a review step like `terraform plan`.
- name: Render config.xml locally
  ansible.builtin.template:
    src: config.xml.j2
    dest: "{{ opnsense_render_dir }}/{{ inventory_hostname }}.xml"
    mode: "0600" # contains the root password hash
  delegate_to: localhost

- name: Render WireGuard road-warrior client configs
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: "{{ opnsense_render_dir }}/wireguard/{{ item.key }}.conf"
    mode: "0600"
  loop: "{{ opnsense_wg_clients | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
