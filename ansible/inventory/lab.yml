# Lab inventory. VMs are created by Terraform (terraform/envs/lab); pve_vmid links each host to
# its Proxmox VM for out-of-band access through the QEMU guest agent. Windows hosts are reached
# from the Proxmox host over the site firewalls' WAN (routes: scripts/host/lab-routes).
all:
  children:
    firewalls:
      hosts:
        hq-fw01:
          ansible_host: 10.10.10.11
          pve_vmid: 101
        br-fw01:
          ansible_host: 10.10.10.12
          pve_vmid: 102
    windows:
      children:
        domain_controllers:
          hosts:
            hq-dc01:
              ansible_host: 172.16.20.11
              pve_vmid: 201
              ad_site: HQ
            br-dc01:
              ansible_host: 172.17.20.11
              pve_vmid: 202
              ad_site: BRANCH
        member_servers:
          children:
            file_servers:
              hosts:
                hq-fs01:
                  ansible_host: 172.16.20.21
                  pve_vmid: 211
                  ad_site: HQ
                  ad_ou: "OU=Servers,OU=HQ,OU=CORP"
