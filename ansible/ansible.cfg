# Run through scripts/ansible.sh (sets ANSIBLE_CONFIG to this file).
[defaults]
inventory = inventory/lab.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# Lab VMs are rebuilt often: trust a host key on first contact, keep them out of ~/.ssh.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.config/lab/known_hosts
