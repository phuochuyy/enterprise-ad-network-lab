# Export each firewall's RUNNING config, sanitized, to docs/network/opnsense/<host>.xml.
# Commit the result: the diff between two exports is the reviewable record of what changed.
# Run: scripts/ansible.sh playbooks/firewalls-export.yml
- name: Export sanitized OPNsense configs
  hosts: firewalls
  gather_facts: false
  vars:
    opnsense_export_dir: "{{ playbook_dir }}/../../docs/network/opnsense"
    opnsense_raw_dir: "{{ playbook_dir }}/../build/raw"
  tasks:
    - name: Fetch the running config.xml
      ansible.builtin.fetch:
        src: /conf/config.xml
        dest: "{{ opnsense_raw_dir }}/{{ inventory_hostname }}.xml"
        flat: true

    - name: Sanitize into the docs tree
      ansible.builtin.command: >-
        {{ playbook_dir }}/../../scripts/opnsense-sanitize.py
        {{ opnsense_raw_dir }}/{{ inventory_hostname }}.xml
        {{ opnsense_export_dir }}/{{ inventory_hostname }}.xml
      delegate_to: localhost
      changed_when: true

    - name: Remove the unsanitized copy
      ansible.builtin.file:
        path: "{{ opnsense_raw_dir }}/{{ inventory_hostname }}.xml"
        state: absent
      delegate_to: localhost
